<div class="recruiter-header">
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" routerLink="/freelance">
                <img src="/images/logo.png" alt="Matchy Khedma Logo">
                <div class="header-brand">
                    <h5>{{ mode === 'CLIENT_FREELANCE' ? 'Client Freelance' : 'Freelance Dashboard' }}</h5>
                    <p class="brand-subtitle">Matchy Khedma</p>
                </div>
            </a>

            <div class="others-option">
                <div class="option-item">
                    <div class="mode-toggle" role="group" aria-label="Changer de vue">
                        <button type="button"
                                class="mode-btn"
                                [class.active]="mode === 'FREELANCER'"
                                (click)="switchToFreelancer()">
                            <i class="ri-code-s-slash-line"></i>
                            Freelancer
                        </button>
                        <button type="button"
                                class="mode-btn"
                                [class.active]="mode === 'CLIENT_FREELANCE'"
                                [disabled]="!canSwitchToClient"
                                (click)="switchToClient()">
                            <i class="ri-building-2-line"></i>
                            Client
                        </button>
                    </div>
                    <span class="welcome-text">Welcome, {{ userName }}</span>
                    <div class="profile-avatar">
                        <i class="ri-user-circle-fill"></i>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>
