<div class="sidebar-area" [class.active]="classApplied">
    <ul class="ps-0 mb-0 list-unstyled">
        <li>
            <a routerLink="/freelance" class="d-block position-relative" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <i class="ri-dashboard-line"></i>
                Dashboard
            </a>
        </li>

        <ng-container *ngIf="mode === 'FREELANCER'">
            <li>
                <a routerLink="/freelance/projects" class="d-block position-relative" routerLinkActive="active">
                    <i class="ri-briefcase-4-line"></i>
                    Missions
                </a>
            </li>
            <li>
                <a routerLink="/freelance/mes-candidatures" class="d-block position-relative" routerLinkActive="active">
                    <i class="ri-file-list-3-line"></i>
                    Mes Candidatures
                </a>
            </li>
        </ng-container>

        <ng-container *ngIf="mode === 'CLIENT_FREELANCE'">
            <li>
                <a routerLink="/freelance/client/post" class="d-block position-relative" routerLinkActive="active">
                    <i class="ri-add-circle-line"></i>
                    Poster une Mission
                </a>
            </li>
            <li>
                <a routerLink="/freelance/client" class="d-block position-relative" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                    <i class="ri-file-list-line"></i>
                    Mes Missions
                </a>
            </li>
        </ng-container>

        <li>
            <a routerLink="/freelance/workspace" class="d-block position-relative" routerLinkActive="active">
                <i class="ri-chat-1-line"></i>
                Contrats & Chat
            </a>
        </li>
        <li>
            <a routerLink="/freelance/scheduler" class="d-block position-relative" routerLinkActive="active">
                <i class="ri-calendar-todo-line"></i>
                Calendrier
            </a>
        </li>
        <li>
            <a routerLink="/freelance/profile" class="d-block position-relative" routerLinkActive="active">
                <i class="ri-user-line"></i>
                Mon Profil
            </a>
        </li>
        <li *ngIf="isCandidat">
            <a routerLink="/candidates-dashboard" class="d-block position-relative">
                <i class="ri-user-search-line"></i>
                Espace Candidat
            </a>
        </li>
        <li class="logout-item">
            <button type="button" class="d-block position-relative logout-btn" (click)="logout()">
                <i class="ri-logout-box-r-line"></i>
                Logout
            </button>
        </li>
    </ul>
</div>

<div class="sidebar-btn d-xl-none" [class.active]="classApplied">
    <button (click)="toggleClass()">
        <span>Menus</span>
    </button>
</div>
